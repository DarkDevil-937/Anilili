name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain > build.log 2>&1 || echo "BUILD_FAILED=1" >> $GITHUB_ENV
      - name: Show errors
        if: env.BUILD_FAILED == '1'
        run: |
          grep -n -B2 -A12 -E "What went wrong|^e: |FAILED|error:" build.log | head -80
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
